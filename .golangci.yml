    - errname        # Enforce standard naming for error vars/types (e.g. ErrSomeError):contentReference[oaicite:27]{index=27}
    - errorlint      # Find issues with Go 1.13+ error wrapping (`fmt.Errorf` %w usage, etc.):contentReference[oaicite:28]{index=28}
    - exhaustive     # Check exhaustiveness of enum `switch` statements (all cases covered):contentReference[oaicite:29]{index=29}

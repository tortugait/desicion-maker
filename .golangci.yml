        linters: [revive]  # Ignore revive rule that every package needs a comment:contentReference[oaicite:98]{index=98}
      # Do not require comments on every exported item (skip revive’s strict rule about comments on exports):
      - text: 'exported \\S+ \\S+ should have comment( \\(or a comment on this block\\))? or be unexported'

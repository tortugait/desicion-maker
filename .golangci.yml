version: "2"  # Use configuration schema version 2 (for golangci-lint v2.x)

# **Run settings** – general execution controls (concurrency, timeouts, path modes, etc.)
run:
  concurrency: 4       # Limit to 4 concurrent linters to avoid saturating CPU (default uses all CPUs:contentReference[oaicite:0]{index=0})
  timeout: 5m          # Global timeout for the linter run (5 minutes) to prevent hangs:contentReference[oaicite:1]{index=1}:contentReference[oaicite:2]{index=2}
  relative-path-mode: gomod  # Use paths relative to go.mod root for consistency across environments:contentReference[oaicite:3]{index=3}:contentReference[oaicite:4]{index=4}
  allow-parallel-runners: true   # Allow multiple golangci-lint instances at once (don’t use file locking)
  allow-serial-runners: true    # If another instance is running, wait instead of failing (serializes runners)

# **Issue reporting** – configure how issues are reported and filtered
issues:
  max-same-issues: 50  # Report up to 50 occurrences of the same issue text (default 3):contentReference[oaicite:5]{index=5}

# **Formatters** – integrate format checkers (these run as linters to enforce formatting)
formatters:
  enable:
    - goimports    # Check that code is goimports-formatted (includes gofmt + import organizing)
    - golines      # Enforce maximum line length by checking/fixing long lines
    - gci          # Ensure imports are grouped and ordered properly (using the gci tool)
  settings:
    goimports:
      # Group project imports separately: list your module path to treat as "local" imports
      local-prefixes:
        - github.com/your-org/your-project  # ← REPLACE with your module import path:contentReference[oaicite:6]{index=6}:contentReference[oaicite:7]{index=7}
    golines:
      max-len: 120  # Set max line length to 120 characters (default is 100):contentReference[oaicite:8]{index=8}:contentReference[oaicite:9]{index=9}
    gci:
      # Define import grouping sections for gci (std, third-party, and project imports):
      sections:
        - standard   # Standard library packages:contentReference[oaicite:10]{index=10}
        - default    # Default (third-party) packages:contentReference[oaicite:11]{index=11}
        - prefix(github.com/tortugait/)   # Company or project-specific external packages (common prefix):contentReference[oaicite:12]{index=12}
        - prefix(github.com/tortugait/decision-maker  # Current project’s module imports:contentReference[oaicite:13]{index=13}
        - blank      # Blank imports (for side effects), separated by an empty line:contentReference[oaicite:14]{index=14}
      custom-order: true        # Use the above custom order instead of the default order:contentReference[oaicite:15]{index=15}
      no-inline-comments: true  # Disallow import-line comments (enforce clean imports):contentReference[oaicite:16]{index=16}
      no-prefix-comments: true  # Disallow comments above import groups (e.g., no manual section labels):contentReference[oaicite:17]{index=17}
      no-lex-order: true        # Do not require lexical ordering within sections (rely on grouping order)

# **Linter selection** – enable a curated set of reliable linters (disable unstable/deprecated ones)
linters:
  default: none  # Start with no default linters (avoid enabling all by default):contentReference[oaicite:18]{index=18}
  enable:
    - staticcheck    # Static analysis (Go vet on steroids: code correctness, bugs, performance):contentReference[oaicite:19]{index=19}
    - govet          # Go vet analyzers (reports suspicious constructs like fmt.Printf arg mismatches):contentReference[oaicite:20]{index=20}
#    - revive         # Modern lint rules (style best practices, replaces golint):contentReference[oaicite:21]{index=21}
    - errcheck       # Checks that error return values are used (no unchecked errors):contentReference[oaicite:22]{index=22}
    - gosec          # Security checks (detect common vulnerabilities):contentReference[oaicite:23]{index=23}:contentReference[oaicite:24]{index=24}
    - bodyclose      # Ensure HTTP response bodies are closed properly:contentReference[oaicite:25]{index=25}

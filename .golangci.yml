  # **Linter-specific configuration** (tuning some linters' parameters)
  settings:
    funlen:
      lines: 100        # Allow functions up to 100 lines (default 60):contentReference[oaicite:89]{index=89}
      statements: 50    # Allow up to 50 statements per function (default 40)
    cyclop:
